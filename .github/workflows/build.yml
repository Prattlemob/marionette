name: Build

on:
  push:
    paths:
      - 'src/**'
      - 'python/**'
      - 'examples/**'
      - 'scripts/verify-python-package.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'python/**'
      - 'examples/**'
      - 'scripts/verify-python-package.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'

concurrency:
  # One in-flight build per branch (or PR): a newer push supersedes the older
  # run so only the latest commit is built.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build
        run: ./gradlew build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r python/requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e ./python
      - run: python -m unittest discover -s python/tests -v
      - run: python -m compileall -q examples
      - run: python -m mypy
        working-directory: python
      - run: python -m build --no-isolation python
      - run: python scripts/verify-python-package.py python/dist
