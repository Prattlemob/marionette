version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # The codec must match Minecraft's pinned Netty core. Update netty_version
    # alongside Minecraft after compatibility verification, not independently.
    ignore:
      - dependency-name: "io.netty:netty-codec-http"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
